<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0618">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0618;--ink:#f4f1ff;--dim:#a59cc9;--cyan:#5ef1ff;--gold:#ffd76b;--amber:#ffb23d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55;display:flex;align-items:center}
main{width:min(100% - 40px,34rem);margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:flex-start;padding:40px 0}
.hole{width:96px;height:96px;border-radius:50%;background:#05020c;border:6px solid var(--amber);box-shadow:0 0 36px var(--amber),inset 0 0 0 2px #fff6dc}
h1{font-family:"Bungee","Impact",sans-serif;font-weight:400;font-size:clamp(28px,7vw,46px);line-height:1.05;margin:0;text-wrap:balance}
p{margin:0;color:var(--dim)}
a{display:inline-block;font:400 18px/1 "Bungee","Impact",sans-serif;color:var(--void);background:var(--cyan);text-decoration:none;padding:15px 22px;border-radius:4px}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="hole" aria-hidden="true"></div>
  <h1>Trang này bị hố đen nuốt mất rồi</h1>
  <p>Địa chỉ bạn mở không có trên trang web này. Có thể link bị gõ nhầm hoặc trang đã được dời đi.</p>
  <a href="/sieu-tan-tinh/">Về trang chủ</a>
</main>
</body>
</html>
